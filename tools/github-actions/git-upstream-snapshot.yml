name: Import Git Upstream Snapshot

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: Git upstream to import
        required: true
      upstream_branch:
        description: Upstream branch to import
        required: true
      snapshot_branch:
        description: Destination snapshot branch
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Import upstream snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          SNAPSHOT_BRANCH: ${{ inputs.snapshot_branch }}
        run: |
          set -euo pipefail

          git config --global user.name "Tinnci"
          git config --global user.email "23432137+Tinnci@users.noreply.github.com"

          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" work
          cd work

          upstream_head="$(git rev-parse HEAD)"
          upstream_title="$(git log -1 --format=%s)"
          snapshot_commit="$(
            GIT_AUTHOR_NAME=Tinnci \
            GIT_AUTHOR_EMAIL=23432137+Tinnci@users.noreply.github.com \
            GIT_COMMITTER_NAME=Tinnci \
            GIT_COMMITTER_EMAIL=23432137+Tinnci@users.noreply.github.com \
            git commit-tree HEAD^{tree} <<EOF
          Import upstream snapshot

          Upstream: $UPSTREAM_REPO
          Branch: $UPSTREAM_BRANCH
          Head: $upstream_head
          Title: $upstream_title
          EOF
          )"

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$snapshot_commit:refs/heads/$SNAPSHOT_BRANCH"

          {
            echo "## Imported snapshot"
            echo
            echo "- upstream repo: \`$UPSTREAM_REPO\`"
            echo "- upstream branch: \`$UPSTREAM_BRANCH\`"
            echo "- upstream head: \`$upstream_head\`"
            echo "- upstream title: $upstream_title"
            echo "- snapshot branch: \`$SNAPSHOT_BRANCH\` -> \`$snapshot_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"
